[package]
name = "httpea"
version = "0.0.1"
description = "HTTP experiments and parsers"
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
http-1_1 = [
    "dep:http-method",
    "dep:http-request-target",
    "dep:http-version",
    "dep:winnow",
]

[dependencies]
bytes = "1"
futures-util = { version = "0.3.17", default-features = false, features = ["std"] }
h3 = "0.0.1"
h3-quinn = "0.0.1"
http = "0.2.9"
http-method = { path = "../http-method", version = "0.0.2", optional = true }
http-request-target = { path = "../http-request-target", version = "0.1.0", optional = true }
http-version = { path = "../http-version", version = "0.0.2", optional = true }
mio = { version = "0.8", features = ["net", "os-poll"] }
quiche = { version = "0.16", features = ["qlog"] }
quinn = "0.8"
ring = "0.16"
rustls = "0.20"
rustls-pemfile = "1"
structopt = "0.3"
tokio = { version = "1.24.2", features = ["full"] }
tracing = "0.1.20"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "1"
winnow = { version = "1", optional = true, default-features = false }
