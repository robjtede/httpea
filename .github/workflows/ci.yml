name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      checks: write # to add clippy checks to PR diffs

    runs-on: ubuntu-latest
    env:
      RUSTUP_HOME: /tmp/httpea-ci-rustup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        id: rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly-2026-10-07
          components: rustfmt,clippy,rust-docs
          cache-shared-key: httpea-ci-exp-controlled-shared-test-${{ github.run_id }}-${{ (github.run_attempt == 1 || github.run_attempt == 2) && 'a' || (github.run_attempt == 3 || github.run_attempt == 4) && 'b' || 'c' }}-${{ github.job }}

      - name: Check formatting
        id: fmt
        background: true
        run: cargo fmt --all -- --check

      - name: Check with Clippy
        id: clippy
        background: true
        uses: giraffate/clippy-action@13b9d32482f25d29ead141b79e7e04e7900281e0 # v1.0.1
        with:
          clippy_flags: --workspace --tests --examples --all-features
          reporter: github-pr-check
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-hack,cargo-nextest,just
        id: tools
        background: true
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-hack,cargo-nextest,just

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Enter Nix devshell
        id: devshell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: .#ci

      - name: Wait for Clippy and test tools
        wait: [clippy, tools]

      - name: Check for broken intra-doc links
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features --workspace

      - name: Run tests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.tools.outcome == 'success' && steps.devshell.outcome == 'success' }}
        run: just test

      - name: Wait for formatting
        wait: fmt
