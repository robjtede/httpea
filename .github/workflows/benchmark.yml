name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 10
    env:
      ZSTD_CLEVEL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          cache-key: codspeed-builds
          cache-workspaces: |
            . -> target/codspeed/walltime
            . -> target/codspeed/analysis
          cache-workspace-crates: true

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-codspeed

      - name: Build benchmarks
        run: cargo codspeed build --all-features --measurement-mode walltime,memory

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        env:
          DIVAN_SAMPLE_SIZE: "10000"
          DIVAN_SAMPLE_COUNT: "10"
          DIVAN_MIN_TIME: "0"
          DIVAN_MAX_TIME: "0.5"
        with:
          mode: walltime,memory
          run: cargo codspeed run
